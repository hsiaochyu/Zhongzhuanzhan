<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中转站 · UI 预览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #f4f4f7;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .phone {
    width: 390px; height: 844px; border-radius: 44px; overflow: hidden;
    background: #fff; position: relative;
    box-shadow: 0 24px 60px rgba(21, 24, 40, .18), 0 2px 6px rgba(21, 24, 40, .06);
    display: flex; flex-direction: column;
  }
  .bg {
    position: absolute; inset: 0 0 auto 0; height: 300px; pointer-events: none;
    background:
      radial-gradient(circle at 88% -4%, rgba(199, 183, 255, .42), rgba(199, 183, 255, 0) 55%),
      radial-gradient(circle at 4% 58%, rgba(191, 216, 255, .30), rgba(191, 216, 255, 0) 50%),
      linear-gradient(180deg, #f1edfb 0%, #f7f5fc 32%, #ffffff 68%);
  }
  .statusbar {
    position: relative; height: 44px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; color: #17181a;
  }
  .status-right { display: flex; align-items: center; gap: 6px; }
  .battery { width: 22px; height: 11px; border: 1.3px solid #17181a; border-radius: 3px; position: relative; }
  .battery::after { content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: #17181a; border-radius: 0 1px 1px 0; }
  .battery i { position: absolute; inset: 1.5px; width: 60%; background: #17181a; border-radius: 1px; display: block; }

  .topbar { position: relative; height: 52px; display: flex; align-items: center; padding: 0 8px; }
  .topbar .back { width: 34px; height: 34px; display: grid; place-items: center; color: #17181a; font-size: 24px; line-height: 1; }
  .topbar .title { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 500; color: #17181a; pointer-events: none; }
  .topbar .more { margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; color: #17181a; }

  .scroll { flex: 1; overflow-y: auto; position: relative; padding-bottom: 96px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  .banner {
    margin: 4px 16px 0; height: 100px; border-radius: 18px; position: relative; overflow: hidden;
    background: linear-gradient(100deg, #e9f1ff 0%, #f5f0ff 55%, #fdf3fa 100%);
    display: flex; align-items: center; padding-left: 20px;
  }
  .banner .cloud { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 132px; height: 100px; }
  .banner .txt { position: relative; z-index: 2; }
  .banner .l1 { display: flex; align-items: flex-end; gap: 6px; }
  .banner .brand { font-size: 23px; font-weight: 800; font-style: italic; letter-spacing: -.4px; color: #3b7de0; }
  .banner .brand2 { font-size: 17px; font-weight: 600; color: #17181a; padding-bottom: 3px; }
  .banner .sub { margin-top: 7px; font-size: 11px; color: #9aa0a6; }

  .sec { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 24px 0 12px; }
  .sec span { font-size: 12px; color: #9aa0a6; letter-spacing: 1px; }
  .sec i { display: block; width: 26px; height: 1px; }
  .sec i.l { background: linear-gradient(90deg, rgba(216,216,222,0), #d8d8de); }
  .sec i.r { background: linear-gradient(90deg, #d8d8de, rgba(216,216,222,0)); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .card {
    height: 88px; background: #fff; border-radius: 16px; border: .5px solid rgba(0,0,0,.05);
    box-shadow: 0 6px 16px rgba(23, 24, 26, .06);
    display: flex; align-items: center; padding: 0 14px 0 16px; cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .card:active { transform: scale(.975); box-shadow: 0 3px 10px rgba(23,24,26,.08); }
  .card .name { font-size: 17px; font-weight: 600; color: #17181a; }
  .card .desc { margin-top: 5px; font-size: 11px; color: #9aa0a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .txt { flex: 1; min-width: 0; }
  .ico {
    width: 42px; height: 42px; border-radius: 13px; background: #f5f6f8; margin-left: 6px;
    display: grid; place-items: center; color: #3a3d42; flex: 0 0 auto;
  }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .recent {
    position: absolute; left: 12px; right: 12px; bottom: 22px; height: 66px;
    background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(23, 24, 26, .14);
    display: flex; align-items: center; padding: 0 10px;
  }
  .recent .cover {
    width: 44px; height: 44px; border-radius: 13px; flex: 0 0 auto;
    background: linear-gradient(140deg, #b9c8e8, #8ca4ce); display: grid; place-items: center; color: #fff;
  }
  .recent .cover svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  .recent .info { flex: 1; min-width: 0; padding-left: 10px; }
  .recent .t1 { font-size: 14px; font-weight: 500; color: #17181a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent .t2 { margin-top: 2px; font-size: 11px; color: #9aa0a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent .go { width: 40px; display: grid; place-items: center; color: #17181a; }
  .recent .go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #17181a; opacity: .85; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="bg"></div>

  <div class="statusbar">
    <div>11:39</div>
    <div class="status-right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 9v2M5 6.5v4.5M9 4v7M13 1.5v9.5" stroke="#17181a" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span style="font-size:11px;font-weight:600">4G</span>
      <span class="battery"><i></i></span>
    </div>
  </div>

  <div class="topbar">
    <div class="back">‹</div>
    <div class="title">中转站</div>
    <div class="more">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#17181a"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </div>
  </div>

  <div class="scroll">
    <div class="banner">
      <svg class="cloud" viewBox="0 0 132 100" aria-hidden="true">
        <defs>
          <radialGradient id="g1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b9d4ff" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#b9d4ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="72" cy="52" rx="54" ry="34" fill="url(#g1)"/>
        <circle cx="58" cy="63" r="19" fill="#fff" fill-opacity=".82"/>
        <circle cx="80" cy="55" r="24" fill="#fff" fill-opacity=".9"/>
        <circle cx="96" cy="66" r="15" fill="#fff" fill-opacity=".82"/>
        <rect x="47" y="62" width="58" height="18" rx="9" fill="#fff" fill-opacity=".82"/>
        <circle cx="36" cy="40" r="4.5" fill="#a9c8ff" fill-opacity=".45"/>
        <circle cx="105" cy="36" r="3" fill="#a9c8ff" fill-opacity=".4"/>
      </svg>
      <div class="txt">
        <div class="l1"><span class="brand">B260608</span><span class="brand2">智能体直达</span></div>
        <div class="sub">探索AI世界</div>
      </div>
    </div>

    <div class="sec"><i class="l"></i><span>列表</span><i class="r"></i></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="recent">
    <div class="cover">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
    </div>
    <div class="info">
      <div class="t1" id="recentTitle">还没有访问记录</div>
      <div class="t2" id="recentHost">点上面的卡片开始</div>
    </div>
    <div class="go">
      <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div class="homebar"></div>
</div>

<script>
const icon = {
  portal: '<circle cx="12" cy="12" r="8.5"/><path d="M12 6.8l4.4 9.6-4.4-2.7-4.4 2.7z"/>',
  camera: '<path d="M3.6 8.4h3.5l1.5-2.1h6.8l1.5 2.1h3.5c.66 0 1.2.54 1.2 1.2v7.3c0 .66-.54 1.2-1.2 1.2H3.6c-.66 0-1.2-.54-1.2-1.2V9.6c0-.66.54-1.2 1.2-1.2z"/><circle cx="12" cy="13.9" r="3.1"/><circle cx="17.65" cy="10.7" r=".55"/>',
  bulb: '<path d="M12 3.4a5.7 5.7 0 0 1 3.5 10.2c-.6.43-.9 1.05-.9 1.7v.9h-5.2v-.9c0-.65-.3-1.27-.9-1.7A5.7 5.7 0 0 1 12 3.4z"/><path d="M9.7 18.5h4.6M10.4 20.4h3.2M6.1 5.1 4.9 3.9M17.9 5.1 19.1 3.9M3.6 10.3H2M20.4 10.3h1.6"/>',
  calendar: '<path d="M5 5.1h14c.83 0 1.5.67 1.5 1.5v12.3c0 .83-.67 1.5-1.5 1.5H5c-.83 0-1.5-.67-1.5-1.5V6.6c0-.83.67-1.5 1.5-1.5z"/><path d="M8 3.2v3.2M16 3.2v3.2M3.5 9.5h17M9 14.1l2.2 2.2 4-4.5"/>',
  person: '<circle cx="12" cy="8.1" r="3.4"/><path d="M4.9 19.7a7.4 7.4 0 0 1 14.2 0"/>',
  forum: '<path d="M3.6 5.4h11.2c.77 0 1.4.63 1.4 1.4v6.4c0 .77-.63 1.4-1.4 1.4h-1.5l-2.4 2.3v-2.3H3.6c-.77 0-1.4-.63-1.4-1.4V6.8c0-.77.63-1.4 1.4-1.4z"/><path d="M17.1 10.6h3.2c.66 0 1.2.54 1.2 1.2v4.9c0 .66-.54 1.2-1.2 1.2h-3.2c-.66 0-1.2-.54-1.2-1.2v-4.9c0-.66.54-1.2 1.2-1.2z"/>',
  book: '<path d="M12 6.6C10.4 5.5 8.2 5.1 5.1 5.3v11.5c3.1-.2 5.3.2 6.9 1.3 1.6-1.1 3.8-1.5 6.9-1.3V5.3c-3.1-.2-5.3.2-6.9 1.3z"/><path d="M12 6.6v11.5"/>',
  graduation: '<path d="M12 4.4 2.6 8.9 12 13.4 21.4 8.9z"/><path d="M5.8 10.6v4.7c0 1.9 2.8 3.2 6.2 3.2s6.2-1.3 6.2-3.2v-4.7M21.4 8.9v4.3"/>',
  celebration: '<path d="M6 21V3"/><path d="M6 4h11l-2.5 3.5L17 11H6"/>',
  web: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 2.4 14.5 0 17M12 3.5c-2.4 2.5-2.4 14.5 0 17"/>'
};

const featured = [
  { id:'agent-1', name:'AI世界',   desc:'智能体导航门户',       icon:'portal',     url:'https://comate.wpsgo.com/s/mVJ7J8UuzHx2/?' },
  { id:'agent-7', name:'学搭子',   desc:'班级资料与作业事务',   icon:'book',       url:'https://124.156.164.21:8080/' },
  { id:'agent-5', name:'个人信息', desc:'个人信息中心',         icon:'person',     url:'https://comate.wpsgo.com/s/mVJ7J8UuzHx2/profile.html' },
  { id:'agent-9', name:'活动管家', desc:'AI活动方案策划',       icon:'celebration', url:'https://comate.wpsgo.com/s/7DCwXPfPETk7/?' },
  { id:'agent-4', name:'考勤助手', desc:'晚自习智能考勤',       icon:'calendar',   url:'https://comate.wpsgo.com/s/aBtvyx15sO5E/?' },
  { id:'agent-3', name:'百事通',   desc:'南邮校园生活智能问答助手', icon:'bulb',     url:'https://comate.wpsgo.com/s/QVXRFGMPhpl6/?' },
  { id:'agent-8', name:'四六级',   desc:'四六级学习智能体',     icon:'graduation', url:'https://www.modelscope.cn/studios/xingran110/cet-agent?mode=full' },
  { id:'agent-2', name:'摄影展示', desc:'校园摄影作品展示',     icon:'camera',     url:'https://comate.wpsgo.com/s/KmdJnI35EU2T/?' }
];

function svg(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (icon[k] || icon.web) + '</svg>'; }

function bind(el, item) {
  el.addEventListener('click', () => {
    document.getElementById('recentTitle').textContent = item.name;
    document.getElementById('recentHost').textContent = new URL(item.url).host.replace(/^www\./, '');
    window.open(item.url, '_blank', 'noopener');
  });
}

const grid = document.getElementById('grid');
featured.forEach(it => {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<div class="txt"><div class="name">' + it.name + '</div><div class="desc">' + it.desc + '</div></div><div class="ico">' + svg(it.icon) + '</div>';
  bind(d, it);
  grid.appendChild(d);
});
</script>
</body>
</html>
